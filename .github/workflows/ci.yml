name: Build and Push Docker Images

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push backend image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        dockerfile: ./backend/Dockerfile
        push: true
        tags: solomonlib/ecommerce-backend:latest, solomonlib/ecommerce-backend:${{ github.sha }}

    - name: Build and push frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        dockerfile: ./frontend/Dockerfile
        push: true
        tags: solomonlib/ecommerce-frontend:latest, solomonlib/ecommerce-frontend:${{ github.sha }}

  deploy:
    needs: build-and-push # Only runs if the build succeeds
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}      # Your EC2 Public IP
          username: ubuntu                   # or 'ec2-user'
          key: ${{ secrets.EC2_SSH_KEY }}    # The contents of your .pem file
          script: |
            cd /home/ubuntu/Ecommerce
            git pull origin main
            echo "POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}" > .env
            echo "POSTGRES_USER=${{ secrets.DB_USER }}" >> .env  
            echo "POSTGRES_DB=${{ secrets.DB_NAME }}" >> .env
            echo "REACT_APP_API_URL=http://${{ secrets.EC2_HOST }}:5000" >> .env
            docker-compose pull
            docker-compose up -d      
            docker-image prune -f
            